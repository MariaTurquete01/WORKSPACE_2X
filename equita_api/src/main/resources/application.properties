spring.application.name=equita_api

# ================= BANCO DE DADOS =================
# Mesmo usuario/senha do projeto pizzaria (login SQL Server)
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=bd_equita_2x;integratedSecurity=false;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=@ITB123456

# ================= JPA / HIBERNATE =================
# O schema ja existe no SQL Server (criado pelo bd_equita_2x.sql),
# por isso o Hibernate NAO deve alterar as tabelas (ddl-auto = none)
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Mantem os nomes das colunas exatamente como estao no banco (camelCase)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

logging.level.org.hibernate.SQL=DEBUG

# ================= ERROS HTTP =================
# expoe a mensagem de negocio (RuntimeException) no corpo do erro,
# para que o frontend possa exibir "Username ja cadastrado", "Protocolo nao encontrado" etc.
server.error.include-message=always
